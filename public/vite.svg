<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14141d" />
      <stop offset="50%" stop-color="#0a0a0f" />
      <stop offset="100%" stop-color="#020204" />
    </linearGradient>

    <!-- Amber Gold Primary Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="40%" stop-color="#FBBF24" />
      <stop offset="80%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <!-- Drop Shadow & Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="256" height="256" rx="60" fill="url(#bgGradient)" />

  <!-- Subtle Radial Inner Glow -->
  <circle cx="128" cy="128" r="100" fill="url(#centerGlow)" />

  <!-- Outer Border Ring -->
  <rect
    x="8"
    y="8"
    width="240"
    height="240"
    rx="52"
    fill="none"
    stroke="url(#goldGrad)"
    stroke-width="5"
    stroke-opacity="0.85"
  />

  <!-- Subtle Inner Tech Border Accent -->
  <rect
    x="18"
    y="18"
    width="220"
    height="220"
    rx="42"
    fill="none"
    stroke="#FDE047"
    stroke-width="1.5"
    stroke-opacity="0.2"
    stroke-dasharray="16 8"
  />

  <!-- Left Code Bracket "<" -->
  <path
    d="M 68 102 L 38 128 L 68 154"
    fill="none"
    stroke="url(#goldGrad)"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#goldGlow)"
  />

  <!-- Right Code Bracket ">" -->
  <path
    d="M 188 102 L 218 128 L 188 154"
    fill="none"
    stroke="url(#goldGrad)"
    stroke-width="12"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#goldGlow)"
  />

  <!-- Diamond Tech Node Top -->
  <polygon
    points="146,58 154,68 146,78 138,68"
    fill="url(#goldGrad)"
    filter="url(#goldGlow)"
  />

  <!-- Central "J" Monogram -->
  <path
    d="M 124 94 L 146 94 L 146 150 C 146 168 134 180 114 180 C 96 180 84 170 82 154"
    fill="none"
    stroke="url(#goldGrad)"
    stroke-width="16"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#goldGlow)"
  />

  <!-- Micro AI / Spark Node -->
  <circle cx="82" cy="154" r="4" fill="#FEF08A" />
  <circle cx="146" cy="94" r="3.5" fill="#FEF08A" />
</svg>